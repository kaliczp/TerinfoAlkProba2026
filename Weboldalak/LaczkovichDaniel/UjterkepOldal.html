<HTML>
<!-- Ez lenne a fejléc -->
<head>
 <meta charset="UTF-8">
 <title>Térkép oldalam</title>
 <style>
	#map {
    margin: 0 auto;
    height: 600px;
    width: 90%;
    border: 3px solid black;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
</style>
</head>
<body>
<H1>Itt lesz a térképem.</H1>
<div id="map"></div>
 
<script>
function initMap() {

  const pozicio = {
    lat: 47.41351369035433,
    lng: 19.39729561045767
  };

  const map = new google.maps.Map(
    document.getElementById("map"),
    {
      zoom: 14,
      center: pozicio
    }
  );

const marker = new google.maps.Marker({
  position: pozicio,
  map: map,
  icon: "https://maps.google.com/mapfiles/kml/shapes/homegardenbusiness.png"
});
 
 } 
</script>
 <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQfIDF1PAK-7ZioLgeBTDQ3YIumDxLQds&callback=initMap"
  ></script>
</body>
</HTML>
