<!DOCTYPE html>
<html>
<HEAD>
	<meta charset="UTF-8">
</HEAD>
<body>

<h1>Az első JavaScriptem</h1>

<p>JavaScript meg tudja változtatni egy HTML-elem tartalmát:</p>

<button type="button" onclick="myFunction()">Kattints rám!</button>

<p id="demo">Ez egy bemutató.</p>

<script>
function myFunction() { 
  document.getElementById("demo").innerHTML = "Hello Világ!";
}
</script>

</body>
</html>
