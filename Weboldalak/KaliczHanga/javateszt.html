<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
</head>
<body>

<h1>Az első JavaScriptem</h1>

<p>A JavaScript meg tudja változtatni egy HTML elem tartalmát:</p>

<button type="button" onclick="myFunction()">Kattintson rám!</button>

<p id="demo">Ez egy bemutató.</p>

<script>
function myFunction() { 
  document.getElementById("demo").innerHTML = "Helló JavaScript!";
}
</script>

</body>
</html>
