<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <title>Szentirmai Soma Javascript</title> 
  </head>
<body>
<h1>Számolás</h1>
<h2>Téglalap területének kiszámítása</h2>
<p>Add meg a téglalap oldalait:</p>
<input type="number" id="oldalA" placeholder="Hosszúság"> <span>cm</span>
<br><br>
<input type="number" id="oldalB" placeholder="Szélesség"> <span>cm</span>
<br><br>
<button onclick="szamol()">Számolás</button>
<p id="demo"></p>
<script>
function szamol() {
let a = document.getElementById("oldalA").value;
let b = document.getElementById("oldalB").value;
if (a !== "" && b !== "") {
let terulet = a * b;
document.getElementById("demo").innerHTML =
"A téglalap területe: " + terulet + " cm<sup>2</sup>";
}
}
</script>
</body>
</html>
