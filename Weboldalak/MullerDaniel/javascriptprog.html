<!DOCTYPE html>
<html>
  <HEAD>
    <meta charset="UTF-8">
    <TITLE>Müller Dániel függvénye</TITLE>
  </HEAD>
<body>

<h1>JavaScript függvény</h1>
<p>Egy függvény, amely szöveget ad vissza:</p>

<p id="demo"></p>

<script>
function sayHello() {
  return "Hello";
}

let message = sayHello();

document.getElementById("demo").innerHTML = message;
</script>

</body>
</html>
