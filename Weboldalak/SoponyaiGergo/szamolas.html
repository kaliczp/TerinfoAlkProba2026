<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>

<h1>Számolás</h1>
<h2>Négyzet területének kiszámítása</h2>

<p>Add meg a négyzet oldalát (a):</p>
<input type="number" id="oldal" placeholder="Pl. 5"> <span>m</span>
<button onclick="szamol()">Számolás</button>

<p id="demo"></p>

<script>
function szamol() {
  let a = document.getElementById("oldal").value;
 
  let terulet = a * a;
 
  document.getElementById("demo").innerHTML = "A négyzet területe: " + terulet + " m<sup>2</sup>";
}
</script>

</body>
</html>
