<!DOCTYPE html>
<html>
<body>

<h1>JavaScriptem</h1>

<p>JavaScript kód felülírja a HTML elemet:</p>

<button type="button" onclick="myFunction()">Kattints!</button>

<p id="demo">Ez fog változni.</p>

<script>
function myFunction() { 
  document.getElementById("demo").innerHTML = "Hello a JavaScript változtatott!";
}
</script>

</body>
</html>
