
<!DOCTYPE html>
<html>
<body>

<h2>Számolás</h2>

<p>Add meg a hatszög oldalának hosszát:</p>

<input type="number" id="oldal" placeholder="Oldalhossz">

<button onclick="szamitas()">Számítás</button>

<p id="eredmeny"></p>

<!-- Felugró dicsérőablak -->
<div id="popup" style="display:none; text-align:center;
background-color:#fff3cd; padding:20px; margin-top:20px;
border:2px solid orange; border-radius:15px;">

    <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="48" fill="#FFD54F"/>
        <circle cx="44" cy="48" r="5" fill="#333"/>
        <circle cx="76" cy="48" r="5" fill="#333"/>
        <path d="M40 68 Q60 95 80 68"
        stroke="#333" stroke-width="4" fill="none"
        stroke-linecap="round"/>
        <path d="M15 15 L20 25 L30 27 L22 34 L24 44
        L15 38 L6 44 L8 34 L0 27 L10 25 Z"
        fill="orange"/>
        <path d="M100 12 L104 22 L114 24 L106 31
        L108 41 L100 35 L92 41 L94 31 L86 24
        L96 22 Z" fill="orange"/>
    </svg>


    <h2>🎉 Ügyes vagy! 🎉</h2>
    <p>Sikeresen kiszámoltad, megérdemelsz egy sört!</p>

    <button onclick="bezar()">Bezárás</button>
</div>

<script>
function szamitas() {
    let a = Number(document.getElementById("oldal").value);

    if (a <= 0 || document.getElementById("oldal").value === "") {
        document.getElementById("eredmeny").innerHTML =
        "Adj meg egy pozitív számot!";
        document.getElementById("popup").style.display = "none";
    } else {
        let terulet = (3 * Math.sqrt(3) / 2) * Math.pow(a, 2);
        let kerulet = 6 * a;

        document.getElementById("eredmeny").innerHTML =
        "A hatszög területe: " + terulet.toFixed(2) + " m²<br>" +
        "A hatszög kerülete: " + kerulet.toFixed(2) + " m";

        document.getElementById("popup").style.display = "block";
    }
}

function bezar() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
