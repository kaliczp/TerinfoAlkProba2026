<h1>JavaScript függvény</h1>
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Összeadás</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; }
        .eredmeny { font-weight: bold; font-size: 1.2em; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Összeadás</h1>

    <label for="elso_szam">Első szám:</label>
    <input type="number" id="elso_szam" placeholder="Írd be az első számot">

    <label for="masodik_szam">Második szám:</label>
    <input type="number" id="masodik_szam" placeholder="Írd be a második számot">

    <button onclick="osszeadas()">Összeadás</button>

    <div class="eredmeny" id="eredmeny_doboz">Összeg: 0</div>

    <hr style="margin: 30px 0;">
    <a href="index.html">&larr; Vissza a főoldalra</a>

    <script>
        function osszeadas() {
            const elso = parseFloat(document.getElementById('elso_szam').value) || 0;
            const masodik = parseFloat(document.getElementById('masodik_szam').value) || 0;
            
            const osszeg = elso + masodik;

            document.getElementById('eredmeny_doboz').innerText = 'Összeg: ' + osszeg;
        }
    </script>

</body>
</html>
</body>
</html>
